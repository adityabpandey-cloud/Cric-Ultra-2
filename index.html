<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Original Cricket Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Loading Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Wait for Three.js to be ready
        window.onload = function() {
            if (typeof THREE === 'undefined') {
                alert("Library load nahi ho payi. Please refresh karein.");
                return;
            }
            init();
        };

        function init() {
            // 1. Scene Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Lighting (Essential for Standard Material)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
            sunLight.position.set(5, 10, 7.5);
            scene.add(sunLight);

            // 3. Realistic Grass Ground
            const loader = new THREE.TextureLoader();
            const grassTex = loader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(10, 10);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ map: grassTex })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 4. Brown Pitch
            const pitch = new THREE.Mesh(
                new THREE.PlaneGeometry(3, 15),
                new THREE.MeshStandardMaterial({ color: 0x8B4513 })
            );
            pitch.rotation.x = -Math.PI / 2;
            pitch.position.y = 0.02; // Flicker se bachne ke liye thoda upar
            scene.add(pitch);

            // 5. Camera Position (Batsman POV)
            camera.position.set(0, 2, 10); 
            camera.lookAt(0, 1, -5);

            // 6. Animation
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            // Resize Fix
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
        }
    </script>
</body>
</html>
