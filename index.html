<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Realistic Cricket - TV Broadcast Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-layer {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .controls { font-size: 18px; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; }
        #scoreboard {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8);
            color: #ffff00; padding: 15px; border-left: 5px solid #003399; font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <!-- Scoreboard UI -->
    <div id="scoreboard">
        <div style="font-size: 24px; font-weight: bold;">IND 245/4</div>
        <div style="font-size: 16px;">OVERS: 42.1</div>
    </div>
    <!-- Control Hints -->
    <div id="ui-layer">
        <div class="controls">SPACE: Bowl | CLICK: Hit | A/D: Move Crease | V: Switch Camera</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. CORE ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- 2. REALISTIC LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        scene.add(sunLight);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
        scene.add(hemiLight);

        // --- 3. STADIUM & PITCH ---
        const loader = new THREE.TextureLoader();
        const grassTex = loader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(50, 50);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ map: grassTex }));
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
        scene.add(ground);

        // Boundary Rope
        const rope = new THREE.Mesh(new THREE.TorusGeometry(45, 0.25, 16, 100), new THREE.MeshStandardMaterial({color: 0xffffff}));
        rope.rotation.x = Math.PI/2; rope.position.y = 0.1; scene.add(rope);

        // Pitch with realistic scuff marks
        const pitchCanvas = document.createElement('canvas');
        pitchCanvas.width = 128; pitchCanvas.height = 512;
        const pCtx = pitchCanvas.getContext('2d');
        pCtx.fillStyle = '#8B4513'; pCtx.fillRect(0,0,128,512);
        for(let i=0; i<40; i++) { pCtx.fillStyle='rgba(255,255,255,0.05)'; pCtx.fillRect(Math.random()*128, Math.random()*512, 10, 2); }
        const pitchTex = new THREE.CanvasTexture(pitchCanvas);
        const pitch = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 22), new THREE.MeshStandardMaterial({map: pitchTex}));
        pitch.rotation.x = -Math.PI / 2; pitch.position.y = 0.03; pitch.receiveShadow = true;
        scene.add(pitch);

        // --- 4. HIGH-DETAIL PLAYERS ---
        function createProPlayer(x, z, color, isBatsman = false) {
            const group = new THREE.Group();
            const skin = new THREE.MeshStandardMaterial({color: 0xffdbac});
            const kit = new THREE.MeshStandardMaterial({color: color});

            // Torso
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.25, 0.8), kit);
            torso.position.y = 1.3; group.add(torso);

            // Head & Helmet
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22), skin);
            head.position.y = 2.0; group.add(head);
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16, 0, Math.PI*2, 0, Math.PI/1.8), new THREE.MeshStandardMaterial({color: 0x003399}));
            helmet.position.y = 2.05; group.add(helmet);

            // Legs & Pads
            const lLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.9), kit);
            lLeg.position.set(-0.18, 0.45, 0); group.add(lLeg);
            const rLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.9), kit);
            rLeg.position.set(0.18, 0.45, 0); group.add(rLeg);

            if(isBatsman) {
                const pad = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.2), new THREE.MeshStandardMaterial({color: 0xffffff}));
                pad.position.set(0, 0.4, 0.1); 
                lLeg.add(pad.clone()); 
                rLeg.add(pad);
            }

            group.position.set(x, 0, z); group.castShadow = true;
            group.traverse(c => { if(c.isMesh) c.castShadow = true; });
            scene.add(group); return group;
        }

        const teamColor = 0xFFD700; // Team India Yellow/Gold
        const batsman = createProPlayer(0, 8.5, teamColor, true);
        const bowler = createProPlayer(0, -10, 0x333333);

        // --- 5. PHYSICS & BALL ENGINE ---
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshStandardMaterial({color: 0xaa0000}));
        ball.position.set(0, 2, -10); ball.castShadow = true; scene.add(ball);
        let ballVel = new THREE.Vector3(0, 0, 0);
        let isBowling = false;

        // --- 6. ANIMATION & CAMERA LOOP ---
        let viewMode = 'BATSMAN';
        function animate() {
            requestAnimationFrame(animate);
            
            // Ball Physics
            if(isBowling) {
                ball.position.add(ballVel);
                ballVel.y -= 0.015; // Gravity
                if(ball.position.y <= 0.12) { 
                    ball.position.y = 0.12; 
                    ballVel.y *= -0.65; // Bounce
                    ballVel.z *= 0.99; // Pitch friction
                }
                // Out of bounds reset
                if(ball.position.length() > 70) { isBowling = false; ballVel.set(0,0,0); ball.position.set(0,2,-10); }
            }

            // Camera Transitions
            if(viewMode === 'BATSMAN') {
                camera.position.lerp(new THREE.Vector3(0, 2.5, 14), 0.1);
                camera.lookAt(0, 1.2, -5);
            } else {
                camera.position.lerp(new THREE.Vector3(ball.position.x + 6, 6, ball.position.z + 10), 0.05);
                camera.lookAt(ball.position);
            }
            
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. INTERACTIVE CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') { 
                isBowling = true; 
                ball.position.set(0, 2, -10); 
                ballVel.set((Math.random()-0.5)*0.02, 0.05, 0.7); 
            }
            if(e.key === 'a') batsman.position.x -= 0.15;
            if(e.key === 'd') batsman.position.x += 0.15;
            if(e.key === 'v') viewMode = viewMode === 'BATSMAN' ? 'FOLLOW' : 'BATSMAN';
        });
        window.addEventListener('mousedown', () => {
            // Simple Bat-Ball Collision
            if(ball.position.distanceTo(batsman.position) < 2) {
                ballVel.set((Math.random()-0.5)*0.5, 0.4, -0.9);
                if(viewMode === 'BATSMAN') viewMode = 'FOLLOW'; // Auto-switch camera on hit
            }
        });

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>\
