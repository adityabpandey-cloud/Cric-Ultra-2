<!DOCTYPE html>
<html>
<head>
    <title>Cric-Ultra 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; } /* Sky Blue */
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Setup the World
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add the Pitch (Green Grass)
        const pitchGeo = new THREE.PlaneGeometry(20, 100);
        const pitchMat = new THREE.MeshBasicMaterial({ color: 0x228B22 }); // Forest Green
        const pitch = new THREE.Mesh(pitchGeo, pitchMat);
        pitch.rotation.x = -Math.PI / 2; // Lay it flat
        scene.add(pitch);

        // 3. Add the Cricket Ball (Red)
        const ballGeo = new THREE.SphereGeometry(0.2, 32, 32);
        const ballMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Red
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.y = 0.2; // Place it on top of grass
        scene.add(ball);

        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // 4. Make it move!
        let speed = 0.2;
        function animate() {
            requestAnimationFrame(animate);
            ball.position.z -= speed; // The ball rolls down the pitch
            if (ball.position.z < -50) ball.position.z = 10; // Reset ball
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
