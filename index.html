<!DOCTYPE html>
<html>
<head>
    <title>Realistic Cricket</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #msg { position: absolute; color: white; top: 10px; width: 100%; text-align: center; font-family: sans-serif; z-index: 10; }
    </style>
    <!-- LOAD THESE FIRST -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="msg">Wait... Loading Stadium</div>

    <script>
        // THE GAME LOGIC (Paste your script here)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(10, 20, 10);
        sun.castShadow = true;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        // Field
        const pitch = new THREE.Mesh(new THREE.PlaneGeometry(4, 25), new THREE.MeshStandardMaterial({color: 0x8B4513}));
        pitch.rotation.x = -Math.PI / 2;
        pitch.receiveShadow = true;
        scene.add(pitch);

        const outfield = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({color: 0x228B22}));
        outfield.rotation.x = -Math.PI / 2;
        outfield.position.y = -0.01;
        outfield.receiveShadow = true;
        scene.add(outfield);

        // Player
        let player, mixer;
        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();
        loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
            player = gltf.scene;
            player.scale.set(0.5, 0.5, 0.5);
            player.position.set(0, 0, 10);
            scene.add(player);
            mixer = new THREE.AnimationMixer(player);
            mixer.clipAction(gltf.animations[0]).play();
            document.getElementById('msg').innerHTML = "WASD to move | Click to Hit";
        });

        function animate() {
            requestAnimationFrame(animate);
            if(mixer) mixer.update(clock.getDelta());
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
