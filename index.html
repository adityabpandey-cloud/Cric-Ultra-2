<!DOCTYPE html>
<html>
<head>
    <title>Cric-Ultra 26 | Fixed</title>
    <!-- Sabse zaroori line: Library Connection -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000b1e);

        // Camera (12 units - Jo tumne set kiya)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Light (Black screen ka paka fix)
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // Test Object (Taaki pata chale ki screen on ho gayi)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0x00d2ff });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.y += 0.01; // Cube ghoomega toh pata chalega engine zinda hai
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
