<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RC 24 Style 3D Cricket</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #msg { 
            position: absolute; color: white; top: 20px; width: 100%; 
            text-align: center; z-index: 100; text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            pointer-events: none; font-size: 1.4rem; font-weight: bold;
        }
    </style>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="msg">Starting Engine...</div>

    <script>
        // 1. ENGINE & ATMOSPHERE
        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // 2. STADIUM LIGHTING
        const sun = new THREE.DirectionalLight(0xffffff, 1.3);
        sun.position.set(30, 50, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; 
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));

        // Reflections
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new THREE.Scene()).texture;

        // 3. FIELD TEXTURES
        const texLoader = new THREE.TextureLoader();
        const grassTex = texLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(60, 60);

        const outfield = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300), 
            new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 })
        );
        outfield.rotation.x = -Math.PI / 2;
        outfield.receiveShadow = true;
        scene.add(outfield);

        const pitch = new THREE.Mesh(
            new THREE.PlaneGeometry(3.5, 22), 
            new THREE.MeshStandardMaterial({ color: 0x966F33, roughness: 0.9 })
        );
        pitch.rotation.x = -Math.PI / 2;
        pitch.position.y = 0.02;
        pitch.receiveShadow = true;
        scene.add(pitch);

        // 4. HUMAN PLAYER LOADING WITH PROGRESS BAR
        let player, mixer;
        const loader = new THREE.GLTFLoader();
        
        loader.load('https://models.readyplayer.me/648827725514f49451184d0a.glb', 
            (gltf) => {
                // SUCCESS LOGIC
                player = gltf.scene;
                player.scale.set(1.4, 1.4, 1.4);
                player.position.set(0, 0, 8);
                player.traverse(n => { if(n.isMesh) { n.castShadow = true; n.material.roughness = 0.6; } });
                scene.add(player);
                
                mixer = new THREE.AnimationMixer(player);
                if(gltf.animations.length > 0) mixer.clipAction(gltf.animations[0]).play();
                
                document.getElementById('msg').innerHTML = "READY! WASD to Move";
            },
            (xhr) => {
                // PROGRESS LOGIC
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('msg').innerHTML = "Downloading Human: " + percent + "%";
            },
            (error) => {
                // ERROR LOGIC
                document.getElementById('msg').innerHTML = "Error loading model. Check console.";
            }
        );

        // 5. CAMERA & INPUTS
        camera.position.set(0, 5, 16); 
        const keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        // 6. LOOP
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) mixer.update(delta);

            if(player) {
                if(keys['a']) player.position.x -= 0.08;
                if(keys['d']) player.position.x += 0.08;
                if(keys['w']) player.position.z -= 0.08;
                if(keys['s']) player.position.z += 0.08;
                
                camera.position.x += (player.position.x - camera.position.x) * 0.05;
                camera.lookAt(player.position.x, 1.5, player.position.z);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
