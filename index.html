<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virat Kohli - RCB Ultra Edition (Clean Code)</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #msg { 
            position: absolute; color: white; top: 20px; width: 100%; 
            text-align: center; z-index: 100; text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none; z-index: 50;
        }
    </style>
    <!-- Using the latest stable Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158/examples/jsm/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="vignette"></div>
    <div id="msg">RCB KIT - VIRAT KOHLI READY</div>

    <script type="module">
        // Using Type Module for modern Three.js support
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158/examples/jsm/loaders/GLTFLoader.js';

        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        // MODERN SETTINGS (Fixes Warnings)
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // Use ColorSpace instead of Encoding (Latest Standard)
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        document.body.appendChild(renderer.domElement);

        // STADIUM LIGHTING
        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(10, 40, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        scene.add(sun);

        const amb = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(amb);

        // GRASS
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 200),
            new THREE.MeshStandardMaterial({ color: 0x347c2c, roughness: 1 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // RCB PLAYER
        let player, mixer;
        const loader = new GLTFLoader();
        
        loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', (gltf) => {
            player = gltf.scene;
            player.scale.set(2, 2, 2);
            
            player.traverse(node => {
                if(node.isMesh) {
                    node.castShadow = true;
                    // Improved Material Logic for RCB Red/Black
                    if(node.name.includes('Surface')) {
                        node.material = new THREE.MeshStandardMaterial({
                            color: 0xcc0000, // Vibrant RCB Red
                            roughness: 0.5,
                            metalness: 0.2
                        });
                    } else {
                        node.material = new THREE.MeshStandardMaterial({
                            color: 0x111111, // RCB Black Pants/Joints
                            roughness: 0.7
                        });
                    }
                }
            });
            scene.add(player);

            mixer = new THREE.AnimationMixer(player);
            if(gltf.animations.length > 0) mixer.clipAction(gltf.animations[0]).play();
        });

        camera.position.set(0, 2, 10);
        camera.lookAt(0, 1.8, 0);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
