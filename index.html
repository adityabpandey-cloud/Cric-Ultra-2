<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cric Ultra - RC24 Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #msg { 
            position: absolute; color: white; top: 20px; width: 100%; 
            text-align: center; z-index: 100; text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            font-size: 1.5rem; font-weight: bold;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="msg">Loading RC24 Style Player...</div>

    <script>
        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Bright Sky Blue
        scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Cinematic colors like RC24
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // 1. STADIUM LIGHTING (Bright Sun like the photo)
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(10, 30, 10);
        sun.castShadow = true;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6)); // Soft fill light

        // 2. VIBRANT GRASS (Matching your photo's color)
        const outfield = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300), 
            new THREE.MeshStandardMaterial({ color: 0x4fb32a, roughness: 0.8 }) // Bright RC24 Green
        );
        outfield.rotation.x = -Math.PI / 2;
        outfield.receiveShadow = true;
        scene.add(outfield);

        // 3. HUMAN PLAYER LOAD
        let player, mixer;
        const loader = new THREE.GLTFLoader();
        
        // Loading a Humanoid character (The 'Xbot' is a perfectly rigged human)
        loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', (gltf) => {
            player = gltf.scene;
            player.scale.set(1.8, 1.8, 1.8);
            player.position.set(0, 0, 5);
            
            player.traverse(n => {
                if(n.isMesh) {
                    n.castShadow = true;
                    // Give him a "Blue Kit" color like Team India in your photo
                    n.material.color.set(0x1a5fb4); 
                }
            });
            scene.add(player);
// Replace the existing loader.load call:
loader.load('path/to/your/virat_kohli_model.glb', (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    // ... rest of your animation logic
});
            // Add a simple "Bat" (Cube placeholder) to his hand
            const bat = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.8, 0.2),
                new THREE.MeshStandardMaterial({color: 0x966F33})
            );
            bat.position.set(0.3, 0.5, 0.2); // Position near hand
            player.add(bat);

            mixer = new THREE.AnimationMixer(player);
            mixer.clipAction(gltf.animations[0]).play(); // Standing/Idle
            
            document.getElementById('msg').innerHTML = "RC24 PLAYER READY";
        });

        // 4. CAMERA VIEW (Similar to your photo)
        camera.position.set(0, 3, 12); 
        camera.lookAt(0, 1.5, 0);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
