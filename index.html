<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virat Kohli - RC24 Ultra Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #msg { 
            position: absolute; color: white; top: 20px; width: 100%; 
            text-align: center; z-index: 100; text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
        }
        /* Added a vignette effect for that RC24 cinematic look */
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.5); pointer-events: none; z-index: 50;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="vignette"></div>
    <div id="msg">VIRAT KOHLI - RC24 READY</div>

    <script>
        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        
        // 1. SKY & FOG (Atmospheric realism)
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // RC24 COLOR GRADING
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputEncoding = THREE.sRGBEncoding;
        
        document.body.appendChild(renderer.domElement);

        // 2. STADIUM LIGHTING
        const sun = new THREE.DirectionalLight(0xffffff, 2.0);
        sun.position.set(15, 40, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        const ambient = new THREE.AmbientLight(0x404040, 1.5); // Boosted fill light
        scene.add(ambient);

        // 3. PITCH & GRASS
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3a8e1d, roughness: 0.9 });
        const outfield = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), grassMat);
        outfield.rotation.x = -Math.PI / 2;
        outfield.receiveShadow = true;
        scene.add(outfield);

        // 4. LOADING THE PLAYER
        let player, mixer;
        const loader = new THREE.GLTFLoader();
        
        // REPLACE THIS URL with your Virat Kohli .glb file path from Sketchfab
        const modelUrl = 'https://threejs.org/examples/models/gltf/Xbot.glb';

        loader.load(modelUrl, (gltf) => {
            player = gltf.scene;
            player.scale.set(2, 2, 2);
            player.position.set(0, 0, 0);
            
            player.traverse(node => {
                if(node.isMesh) {
                    node.castShadow = true;
                    // Apply Team India Blue to the material
                    if(node.name.includes('Body') || node.name.includes('Mesh')) {
                        node.material.color.set(0x003366); // Deep Royal Blue
                    }
                }
            });
            scene.add(player);

            // Add a realistic Bat
            const batGeo = new THREE.BoxGeometry(0.12, 0.9, 0.18);
            const batMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const bat = new THREE.Mesh(batGeo, batMat);
            bat.position.set(0.4, 0.6, 0.3);
            player.add(bat);

            // Animations
            mixer = new THREE.AnimationMixer(player);
            if(gltf.animations.length > 0) {
                mixer.clipAction(gltf.animations[0]).play(); 
            }
        });

        // 5. CAMERA PLACEMENT (Low angle for power)
        camera.position.set(0, 2, 10); 
        camera.lookAt(0, 1.8, 0);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
