<!DOCTYPE html>
<html>
<head>
    <title>Realistic Cricket Game</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #msg { position: absolute; color: white; top: 10px; width: 100%; text-align: center; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="msg">SPACE TO BOWL | CLICK TO HIT | A/D TO MOVE</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lights
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // 3. Pitch & Grass
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x228B22}));
        ground.rotation.x = -Math.PI/2;
        scene.add(ground);
        const pitch = new THREE.Mesh(new THREE.PlaneGeometry(3, 20), new THREE.MeshStandardMaterial({color: 0x8B4513}));
        pitch.rotation.x = -Math.PI/2; pitch.position.y = 0.01;
        scene.add(pitch);

        // 4. Player & Ball
        const batsman = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.5, 0.5), new THREE.MeshStandardMaterial({color: 0xffff00}));
        batsman.position.set(0, 0.75, 8);
        scene.add(batsman);
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshStandardMaterial({color: 0xaa0000}));
        ball.position.set(0, 1, -8);
        scene.add(ball);

        // 5. Logic
        let ballVel = new THREE.Vector3(0,0,0);
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') { ball.position.set(0, 1, -8); ballVel.set(0, 0.02, 0.4); }
            if(e.key === 'a') batsman.position.x -= 0.2;
            if(e.key === 'd') batsman.position.x += 0.2;
        });
        window.addEventListener('mousedown', () => {
            if(ball.position.distanceTo(batsman.position) < 1.5) { ballVel.set(0, 0.2, -0.6); }
        });

        camera.position.set(0, 3, 14);
        camera.lookAt(0, 0, 0);

        function animate() {
            requestAnimationFrame(animate);
            ball.position.add(ballVel);
            if(ball.position.y > 0.12) ballVel.y -= 0.005; else ballVel.y *= -0.5;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
