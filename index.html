<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virat Kohli - RCB Ultra Realistic Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #msg { 
            position: absolute; color: white; top: 20px; width: 100%; 
            text-align: center; z-index: 100; text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
        }
        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none; z-index: 50;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="vignette"></div>
    <div id="msg">RCB KIT - VIRAT KOHLI EDITION</div>

    <script>
        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        
        // 1. STADIUM ENVIRONMENT
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 25, 120);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // CINEMATIC POST-PROCESSING
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        renderer.outputEncoding = THREE.sRGBEncoding;
        
        document.body.appendChild(renderer.domElement);

        // 2. LIGHTING (Stadium Sun)
        const sun = new THREE.DirectionalLight(0xffffff, 1.8);
        sun.position.set(20, 50, 20);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 4096; // High res shadows
        sun.shadow.mapSize.height = 4096;
        scene.add(sun);

        const fillLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(fillLight);

        // 3. PITCH & FIELD
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 1 });
        const field = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), grassMat);
        field.rotation.x = -Math.PI / 2;
        field.receiveShadow = true;
        scene.add(field);

        // 4. PLAYER & RCB KIT LOGIC
        let player, mixer;
        const loader = new THREE.GLTFLoader();
        
        loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', (gltf) => {
            player = gltf.scene;
            player.scale.set(2, 2, 2);
            
            player.traverse(node => {
                if(node.isMesh) {
                    node.castShadow = true;
                    
                    // APPLY RCB COLORS
                    // We target specific parts of the mannequin to simulate a kit
                    if(node.name.includes('Surface')) {
                        // Main Body -> RCB Red
                        node.material = new THREE.MeshStandardMaterial({
                            color: 0x9e0b0b, // RCB Deep Red
                            roughness: 0.6,
                            metalness: 0.1
                        });
                    } else if(node.name.includes('Joints')) {
                        // Joints/Pants -> RCB Black
                        node.material = new THREE.MeshStandardMaterial({
                            color: 0x111111, // Carbon Black
                            roughness: 0.8
                        });
                    }
                }
            });
            scene.add(player);

            // Realistic Bat
            const bat = new THREE.Mesh(
                new THREE.BoxGeometry(0.12, 0.9, 0.15),
                new THREE.MeshStandardMaterial({ color: 0x4b3621, roughness: 0.7 })
            );
            bat.position.set(0.4, 0.7, 0.2);
            player.add(bat);

            // Animation
            mixer = new THREE.AnimationMixer(player);
            if(gltf.animations[0]) mixer.clipAction(gltf.animations[0]).play();
        });

        // 5. CAMERA (Broadcast View)
        camera.position.set(0, 2.5, 9); 
        camera.lookAt(0, 1.8, 0);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if(mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
