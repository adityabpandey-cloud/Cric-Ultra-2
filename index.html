<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Stadium Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #status { color: white; position: fixed; top: 10px; left: 10px; z-index: 100; }
    </style>
</head>
<body>
    <div id="status">Connecting to Stadium...</div>

    <!-- USING ALTERNATIVE CDN (UNPKG) -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

    <script>
        // Check if library loaded after a small delay
        window.addEventListener('load', () => {
            if (typeof THREE === 'undefined') {
                document.getElementById('status').innerHTML = "<b style='color:red'>ERROR: All servers blocked.</b><br>1. Check Internet<br>2. Disable AdBlocker";
            } else {
                startMatch();
            }
        });

        function startMatch() {
            document.getElementById('status').style.display = 'none';

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Light
            const ambient = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambient);

            // Ground & Pitch
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshBasicMaterial({ color: 0x228B22 })
            );
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            const pitch = new THREE.Mesh(
                new THREE.PlaneGeometry(3, 22),
                new THREE.MeshBasicMaterial({ color: 0x8B4513 })
            );
            pitch.rotation.x = -Math.PI / 2;
            pitch.position.y = 0.02;
            scene.add(pitch);

            // Simple Players
            function addPlayer(x, z, color) {
                const p = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2), new THREE.MeshBasicMaterial({ color }));
                p.position.set(x, 1, z);
                scene.add(p);
            }

            addPlayer(0, -10, 0xff69b4); // RR
            addPlayer(0, 8, 0xcc0000);   // RCB

            // Camera View
            camera.position.set(0, 40, 50);
            camera.lookAt(0, 0, 0);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            });
        }
    </script>
</body>
</html>
